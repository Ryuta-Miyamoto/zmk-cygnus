name: Draw ZMK keymaps

on:
  workflow_dispatch:
  push:
    paths:
      - "config/*.keymap"
      - "config/*.dtsi"
      - "keymap_drawer.config.yaml"

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write
    with:
      keymap_patterns: "config/*.keymap"
      config_path: "keymap_drawer.config.yaml"
      # cygnus_xiao is a custom out-of-tree shield, so it isn't in
      # keymap-drawer's known-keyboard database. It's physically the
      # same 3x6+3 layout as the upstream "corne" shield, so reuse
      # that physical layout when drawing.
      parse_args: |
        cygnus_xiao: -l corne
